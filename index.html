<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="DecisionLab: simulador interativo de aprendizagem corporativa. Decisões que desenvolvem competências.">
<title>DecisionLab | Decisões que desenvolvem competências</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315253E'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%231B9AAA'/%3E%3Ccircle cx='23' cy='9' r='3' fill='%23fff'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   1. DESIGN TOKENS
   ===================================================================== */
:root{
  --bg:#F5F7FB; --card:#FFFFFF; --navy:#15253E; --petrol:#176B83; --teal:#1B9AAA;
  --green:#15966A; --amber:#E4A64B; --red:#D96767;
  --green-d:#0E6F4D; --amber-d:#7A4F05; --red-d:#9C3030;
  --green-t:#E5F5EE; --amber-t:#FDF3E1; --red-t:#FBEAEA; --teal-t:#E6F4F6;
  --text:#15253E; --muted:#4F5E75; --line:#DFE5EE; --line-strong:#C5CFDD;
  --r-s:12px; --r-m:16px; --r-l:18px;
  --shadow:0 1px 2px rgba(21,37,62,.05),0 4px 14px rgba(21,37,62,.05);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.015em;font-weight:650}
h1{font-size:clamp(1.65rem,1.2rem + 1.8vw,2.3rem)}
h2{font-size:1.2rem} h3{font-size:1.02rem} p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:100}
.skip:focus{top:12px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* =====================================================================
   2. LAYOUT
   ===================================================================== */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#8FDDE6}
.brand b{display:block;font-size:1.12rem;letter-spacing:-.02em}
.brand small{display:block;color:#B8C5D9;font-size:.76rem;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#D6DEEA;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.side-note{margin-top:auto;font-size:.8rem;color:#B8C5D9;padding:0 8px}
main{padding:34px clamp(18px,3.4vw,44px) 60px;max-width:1240px;width:100%}
.screen{animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:26px;display:grid;gap:8px;max-width:70ch}
.page-head p{color:var(--muted);font-size:1.04rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);padding:24px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:grid;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* =====================================================================
   3. COMPONENTES
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:11px 20px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:#F0F4FA;border-color:#A9B7CB}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--navy);border-color:var(--navy)}
.btn.danger{color:var(--red-d);border-color:#E7B4B4}
.btn.danger:hover:not(:disabled){background:var(--red-t)}
.btn.danger.solid{background:#B94545;border-color:#B94545;color:#fff}
.btn.danger.solid:hover:not(:disabled){background:#9C3030}
.btn.small{min-height:38px;padding:7px 14px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:.86rem;font-weight:600;background:var(--teal-t);color:var(--petrol);border:1px solid #BFE3E8}
.chip.ok{background:var(--green-t);color:var(--green-d);border-color:#B7E2D0}
.chip.warn{background:var(--amber-t);color:var(--amber-d);border-color:#F0D7A5}
.chip.risk{background:var(--red-t);color:var(--red-d);border-color:#EBC0C0}
.chip.plain{background:#EEF2F8;color:var(--muted);border-color:var(--line)}
.chip .icon{width:15px;height:15px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#E3EAF4,#CFDBEA);color:var(--navy);font-weight:700;letter-spacing:.02em;flex:none;position:relative;overflow:hidden}
.avatar::after{content:"";position:absolute;inset:auto -6px -14px -6px;height:22px;background:rgba(21,37,62,.08);border-radius:50% 50% 0 0}
.avatar.sm{width:34px;height:34px;font-size:.78rem}
.avatar.me{background:linear-gradient(180deg,#CDE9ED,#A6D6DD);color:#0F4F61}
.meter{display:flex;gap:4px;align-items:center}
.meter i{display:block;width:22px;height:7px;border-radius:4px;background:#E1E7F0}
.meter i.on{background:var(--petrol)}
.progress{height:8px;border-radius:99px;background:#E4EAF3;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--petrol);border-radius:99px;transition:width .4s ease}
.bar{height:12px;border-radius:99px;background:#E4EAF3;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--petrol)}
.bar.ok>span{background:var(--green)} .bar.warn>span{background:var(--amber)} .bar.risk>span{background:var(--red)}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.95rem}
.facts li{display:flex;align-items:center;gap:8px}
.comp-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.comp-list li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.comp-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-t);color:var(--petrol);display:grid;place-items:center}
.comp-list b{display:block;font-size:.98rem}
.comp-list span.d{color:var(--muted);font-size:.9rem;display:block}
.steps-how{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:14px}
.steps-how li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.steps-how .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.88rem}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r-m);padding:26px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.attempt{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.attempt:first-child{border-top:0}
.score-badge{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;background:var(--teal-t);color:var(--petrol);font-size:1.45rem;font-weight:700}
.mini-bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.mini-bars small{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-bottom:4px}
.notice{border-radius:var(--r-s);padding:13px 16px;background:var(--amber-t);border:1px solid #F0D7A5;color:#5E3E04;display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.notice.info{background:var(--teal-t);border-color:#BFE3E8;color:#0F4F61}
details.acc{border:1px solid var(--line);border-radius:var(--r-s);padding:0 16px;background:#FBFCFE}
details.acc summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:1.3rem;color:var(--petrol)}
details.acc[open] summary::after{content:"−"}
details.acc .acc-body{padding:0 0 16px;color:var(--muted);display:grid;gap:10px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 28px rgba(21,37,62,.3);z-index:60;max-width:min(92vw,520px)}
dialog{border:0;border-radius:var(--r-l);padding:26px;max-width:min(92vw,440px);box-shadow:0 20px 60px rgba(21,37,62,.35);color:var(--text)}
dialog::backdrop{background:rgba(21,37,62,.5)}
dialog h2{margin-bottom:8px} dialog p{color:var(--muted);margin-bottom:22px}
dialog .row{justify-content:flex-end}

/* =====================================================================
   4. BRIEFING
   ===================================================================== */
.client-card{display:flex;gap:16px;align-items:center}
.client-card .avatar{width:64px;height:64px;font-size:1.25rem}
.briefing-list{margin:10px 0 0;padding-left:1.2em;display:grid;gap:8px}
.callout{border-left:4px solid var(--amber);background:var(--amber-t);padding:14px 18px;border-radius:0 var(--r-s) var(--r-s) 0;color:#5E3E04}

/* =====================================================================
   5. SIMULADOR
   ===================================================================== */
.sim{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.sim-side{position:sticky;top:24px;display:grid;gap:18px}
.sim-side .card-inner{display:grid;gap:10px}
.sim-main{display:grid;gap:18px;min-width:0}
.chat-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.chat-head .who{display:flex;gap:12px;align-items:center}
.mood{display:grid;gap:4px;justify-items:end;font-size:.88rem;color:var(--muted)}
.mood b{color:var(--navy)}
.chat-log{height:clamp(250px,40vh,430px);overflow-y:auto;padding:18px 4px 4px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:#F7F9FC}
.msg.client .bubble{border-bottom-left-radius:5px}
.msg.me .bubble{background:var(--navy);border-color:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bubble .who{font-size:.78rem;font-weight:650;margin-bottom:3px;color:var(--petrol)}
.msg.me .bubble .who{color:#9FDDE5}
.msg.new{animation:enter .3s ease both}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.decision legend{padding:0;font-size:1.08rem;font-weight:650;margin-bottom:6px;display:block}
.decision legend small{display:block;color:var(--petrol);font-weight:600;font-size:.88rem;margin-bottom:2px}
.decision fieldset{border:0;padding:0;margin:0;min-width:0}
.prompt{color:var(--muted);margin-bottom:16px;max-width:75ch}
.options{display:grid;gap:12px}
.option{position:relative;display:block;cursor:pointer}
.option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.option-body{display:grid;grid-template-columns:26px 1fr;gap:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--r-m);background:#fff;transition:border-color .15s,background .15s,box-shadow .15s}
.option:hover .option-body{border-color:#9FB4C9;background:#FAFCFE}
.option input:focus-visible + .option-body{outline:3px solid var(--teal);outline-offset:2px}
.option input:checked + .option-body{border-color:var(--petrol);background:var(--teal-t);box-shadow:0 0 0 1px var(--petrol)}
.radio-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;margin-top:2px;color:#fff}
.radio-dot svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.option input:checked + .option-body .radio-dot{background:var(--petrol);border-color:var(--petrol)}
.option input:checked + .option-body .radio-dot svg{opacity:1}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;justify-content:space-between;align-items:center}
.fb{display:grid;gap:16px}
.fb-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.fb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fb-block{border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;background:#FBFCFE}
.fb-block h4{font-size:.9rem;color:var(--petrol);margin-bottom:5px}
.fb-block.wide{grid-column:1/-1;background:var(--teal-t);border-color:#BFE3E8}
.mood-shift{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem}

/* =====================================================================
   6. RELATÓRIO
   ===================================================================== */
.report-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.score-ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ring,var(--petrol)) calc(var(--p)*1%),#E4EAF3 0);display:grid;place-items:center}
.score-ring div{width:118px;height:118px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center}
.score-ring b{font-size:2.3rem;line-height:1;letter-spacing:-.03em}
.score-ring small{display:block;color:var(--muted);font-size:.78rem}
.quote{border-left:4px solid var(--line-strong);padding:4px 0 4px 16px;color:var(--muted);font-style:italic;margin-top:12px}
.comp-report{display:grid;gap:18px}
.comp-row{display:grid;gap:8px}
.comp-row .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.list{margin:10px 0 0;padding-left:1.15em;display:grid;gap:8px}
.step{display:grid;gap:10px;padding:18px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.step .said{background:#F4F7FB;border-radius:var(--r-s);padding:12px 14px;font-size:.96rem}
.step .effects{display:flex;flex-wrap:wrap;gap:8px}
.pathmap{width:100%;height:auto;max-width:640px;display:block}
.report-actions{display:flex;flex-wrap:wrap;gap:12px}

/* =====================================================================
   7. RESPONSIVO
   ===================================================================== */
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px;flex-wrap:wrap}
  .brand small,.side-note{display:none}
  .nav{flex-direction:row}
  .nav button{padding:9px 12px}
  .grid-2,.sim,.cols-2{grid-template-columns:1fr}
  .sim-side{position:static}
  main{padding-top:24px}
}
@media (max-width:620px){
  .fb-grid,.mini-bars{grid-template-columns:1fr}
  .report-hero{grid-template-columns:1fr;justify-items:start}
  .attempt{grid-template-columns:auto 1fr}
  .attempt .row{grid-column:1/-1}
  .msg{max-width:96%}
  .card{padding:18px}
  .mood{justify-items:start}
  .nav button span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* =====================================================================
   8. IMPRESSÃO
   ===================================================================== */
@media print{
  body{background:#fff;font-size:11pt}
  .sidebar,.skip,.report-actions,.toast,#announcer,.no-print{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .step,.comp-row{break-inside:avoid}
  details.acc{display:block}
  details.acc>*{display:block!important}
  .screen{animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo principal</a>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 11.2C13 11 13 6 15 6M9 12.8C13 13 13 18 15 18"/></svg></span>
      <span><b>DecisionLab</b><small>Decisões que desenvolvem competências.</small></span>
    </div>
    <nav class="nav" aria-label="Navegação principal">
      <button type="button" data-action="go-dashboard" id="nav-dashboard"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Início</span></button>
      <button type="button" data-action="go-history" id="nav-history"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg><span>Histórico</span></button>
    </nav>
    <p class="side-note">Seus dados ficam salvos apenas neste navegador.</p>
  </aside>
  <main id="main">
    <noscript><div class="notice">O DecisionLab precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.</div></noscript>
    <section class="screen" id="screen-dashboard" hidden></section>
    <section class="screen" id="screen-briefing" hidden></section>
    <section class="screen" id="screen-sim" hidden></section>
    <section class="screen" id="screen-report" hidden></section>
    <section class="screen" id="screen-history" hidden></section>
  </main>
</div>
<div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-text">
  <form method="dialog">
    <h2 id="dlg-title"></h2><p id="dlg-text"></p>
    <div class="row">
      <button class="btn" value="cancel" id="dlg-cancel">Cancelar</button>
      <button class="btn primary" value="ok" id="dlg-ok">Confirmar</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
/* =====================================================================
   A. DADOS DO CENÁRIO
   Estrutura declarativa (sem funções), pronta para migrar para JSON.
   Condições (when): { flag, notFlag, flagAny[], trustMin, trustMax, chose, choseAny[] }
   Rubrica por alternativa: scores 0 a 3 por competência; trust de -2 a +2.
   ===================================================================== */
const COMPETENCIES = {
  emp:{name:"Empatia",icon:"heart",desc:"Reconhecer a perspectiva e as emoções do cliente.",
    recs:{
      low:"Pratique nomear a emoção do cliente antes de agir e perguntar sobre o impacto que a situação causa. Uma sequência simples ajuda: reconhecer, validar e perguntar.",
      mid:"Você acolheu o cliente em alguns momentos. Procure manter o acolhimento ao longo de toda a conversa, sobretudo ao comunicar atrasos e limites.",
      high:"Mantenha a empatia associada a ações concretas e cuide para que o acolhimento não substitua a informação objetiva."}},
  com:{name:"Comunicação",icon:"chat",desc:"Explicar informações com clareza, transparência e respeito.",
    recs:{
      low:"Estruture notícias difíceis em três partes: o que aconteceu, o que isso significa para o cliente e o que será feito. Evite termos internos como fila e SLA.",
      mid:"Suas respostas oscilaram entre clareza e suavização. Revise-as buscando precisão em datas, responsabilidades e limites.",
      high:"Sua comunicação foi transparente. Experimente acrescentar uma pausa para o cliente reagir antes de avançar para a solução."}},

/* =====================================================================
   C. MOTOR DE RAMIFICAÇÃO E AVALIAÇÃO
   O estado é sempre derivado da lista de decisões: [{scene, option}].
   Isso garante coerência entre simulação, persistência e relatório.
   ===================================================================== */
function matches(c, st){
  if(!c) return true;
  if(c.flag && !st.flags[c.flag]) return false;
  if(c.notFlag && st.flags[c.notFlag]) return false;
  if(c.flagAny && !c.flagAny.some(f=>st.flags[f])) return false;
  if(c.trustMin!==undefined && st.trust < c.trustMin) return false;
  if(c.trustMax!==undefined && st.trust > c.trustMax) return false;
  if(c.chose && !st.chosen.includes(c.chose)) return false;
  if(c.choseAny && !c.choseAny.some(o=>st.chosen.includes(o))) return false;
  return true;
}
function pickVariant(scene, st){ return scene.client.find(v=>matches(v.when, st)) || scene.client[scene.client.length-1]; }
function pickText(x, scene){ return typeof x==="string" ? x : (x[scene.id] || Object.values(x)[0]); }

function computeState(decisions){
  const st={sceneId:CONFIG.startScene,trust:CONFIG.startTrust,scores:{emp:0,com:0,res:0},flags:{},chosen:[],trail:[],finished:false};
  decisions.forEach((d,i)=>{
    if(st.sceneId==="END") throw new Error("Decisões além do encerramento");
    const scene=SCENES[st.sceneId];
    if(!scene || d.scene!==scene.id) throw new Error("Cena inconsistente");
    const idx=scene.options.findIndex(o=>o.id===d.option);
    if(idx<0) throw new Error("Alternativa inexistente");
    const option=scene.options[idx], variant=pickVariant(scene,st), before=st.trust;
    COMP_KEYS.forEach(c=>{ st.scores[c]+=option.scores[c]; });
    st.trust=clamp(st.trust+option.trust,0,CONFIG.maxTrust);
    option.flags.forEach(f=>{ st.flags[f]=true; });
    st.chosen.push(option.id);
    st.trail.push({n:i+1,scene,option,variant,index:idx,trustBefore:before,trustAfter:st.trust});
    st.sceneId=option.next;
  });
  st.finished=st.sceneId==="END";
  return st;
}

const _maxMemo={};
function maxFrom(id,c){
  if(id==="END") return 0;
  const k=id+":"+c; if(k in _maxMemo) return _maxMemo[k];
  return _maxMemo[k]=Math.max(...SCENES[id].options.map(o=>o.scores[c]+maxFrom(o.next,c)));
}

function computeResult(decisions){
  const st=computeState(decisions);
  if(!st.finished) throw new Error("Simulação incompleta");
  const pct={}; COMP_KEYS.forEach(c=>{ pct[c]=clamp(Math.round(st.scores[c]/maxFrom(CONFIG.startScene,c)*100),0,100); });
  const overall=clamp(Math.round(COMP_KEYS.reduce((a,c)=>a+pct[c],0)/COMP_KEYS.length),0,100);
  const T=CONFIG.thresholds; let key="neutral";
  if(st.trust<=T.criticalTrust || overall<T.criticalScore || (st.flags.vague && st.flags.delegated)) key="critical";
  else if(st.trust>=T.positiveTrust && overall>=T.positiveScore && !(st.flags.vague && !st.flags.escalated)) key="positive";
  return {st,pct,overall,trust:st.trust,outcome:OUTCOMES[key],notes:HISTORY_NOTES.filter(n=>matches(n.when,st)).map(n=>n.text)};
}

/* Verificação de integridade do grafo de cenas (executada ao iniciar). */
function validateScenario(){
  const errs=[]; const seen=new Set();
  (function walk(id,depth,stack){
    if(id==="END") return;
    const s=SCENES[id]; if(!s){ errs.push("Cena inexistente: "+id); return; }
    if(stack.includes(id)){ errs.push("Ciclo na cena "+id); return; }
    seen.add(id);
    if(s.options.length!==3) errs.push("A cena "+id+" não tem 3 alternativas");
    if(!s.client||!s.client.length) errs.push("A cena "+id+" não tem fala do cliente");
    s.options.forEach(o=>{
      COMP_KEYS.forEach(c=>{ if(!(o.scores[c]>=0&&o.scores[c]<=3)) errs.push("Pontuação inválida em "+o.id); });
      if(!(o.fb&&o.fb.comunica&&o.fb.comportamento&&o.fb.consequencia&&o.fb.recomendacao)) errs.push("Feedback incompleto em "+o.id);
      walk(o.next,depth+1,stack.concat(id));
    });
  })(CONFIG.startScene,0,[]);
  Object.keys(SCENES).forEach(id=>{ if(!seen.has(id)) errs.push("Cena inalcançável: "+id); });
  // todas as rotas devem ter exatamente 6 decisões
  (function len(id,d){ if(id==="END"){ if(d!==CONFIG.totalDecisions) errs.push("Rota com "+d+" decisões"); return; } SCENES[id]&&SCENES[id].options.forEach(o=>len(o.next,d+1)); })(CONFIG.startScene,0);
  return errs;
}

/* =====================================================================
   D. PERSISTÊNCIA (localStorage versionado, com validação)
   ===================================================================== */
const app={store:null,screen:"dashboard",reportId:null,reportFresh:false,selected:null,locked:false,typingTimer:null,storageWarned:false,notice:null};
const emptyStore=()=>({version:1,current:null,history:[]});

function sanitizeStore(raw){
  const out=emptyStore(); let dropped=0;
  if(!raw||typeof raw!=="object"||raw.version!==1) return {store:out,dropped:1};
  const okDecisions=arr=>Array.isArray(arr)&&arr.every(d=>d&&typeof d.scene==="string"&&typeof d.option==="string");
  if(raw.current){
    try{
      if(!okDecisions(raw.current.decisions)) throw new Error("formato");
      const st=computeState(raw.current.decisions);
      if(st.finished) throw new Error("já concluída");
      out.current={startedAt:typeof raw.current.startedAt==="string"?raw.current.startedAt:new Date().toISOString(),decisions:raw.current.decisions.map(d=>({scene:d.scene,option:d.option})),awaitingContinue:!!raw.current.awaitingContinue&&raw.current.decisions.length>0};
    }catch(e){ dropped++; }
  }
  if(Array.isArray(raw.history)){
    raw.history.forEach(a=>{
      try{
        if(!a||typeof a.id!=="string"||typeof a.date!=="string"||isNaN(new Date(a.date))||!okDecisions(a.decisions)) throw new Error("formato");
        const r=computeResult(a.decisions);
        out.history.push({id:a.id,date:a.date,decisions:a.decisions.map(d=>({scene:d.scene,option:d.option})),summary:{overall:r.overall,outcome:r.outcome.key,pct:r.pct,trust:r.trust}});
      }catch(e){ dropped++; }
    });
  }
  return {store:out,dropped};
}
function loadStore(){
  let raw=null;
  try{ raw=localStorage.getItem(CONFIG.storageKey); }catch(e){ app.storageWarned=true; return emptyStore(); }
  if(!raw) return emptyStore();
  let parsed; try{ parsed=JSON.parse(raw); }catch(e){ app.notice="Os dados salvos estavam corrompidos e foram reiniciados."; return emptyStore(); }
  const {store,dropped}=sanitizeStore(parsed);
  if(dropped) app.notice="Alguns registros salvos estavam inválidos e foram ignorados.";
  return store;
}
function saveStore(){
  try{ localStorage.setItem(CONFIG.storageKey,JSON.stringify(app.store)); }
  catch(e){ if(!app.storageWarned){ app.storageWarned=true; toast("Não foi possível salvar neste navegador. O progresso será mantido apenas enquanto esta página estiver aberta."); } }
}

function renderBriefing(){

function emotionMeter(key){
  const e=EMOTIONS[key]||EMOTIONS.reservado;
  return `<div class="mood" aria-label="Estado emocional do cliente: ${e.label}, abertura ${e.level} de 5">
    <span>Estado emocional: <b>${e.label}</b></span>
    <span class="meter" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=e.level?"on":""}"></i>`).join("")}</span></div>`;
}
function bubbleHTML(b){
  if(b.who==="client") return `<div class="msg client ${b.isNew?"new":""}"><div class="avatar sm" aria-hidden="true">RM</div><div class="bubble"><div class="who">Rafael Martins</div><p>${esc(b.text)}</p></div></div>`;
  return `<div class="msg me"><div class="avatar sm me" aria-hidden="true">VC</div><div class="bubble"><div class="who">Você</div><p>${esc(b.text)}</p></div></div>`;
}
function choiceHTML(st){
  const scene=SCENES[st.sceneId], n=st.trail.length+1;
  return `<form id="choice-form" novalidate>
    <fieldset>
      <legend id="decision-legend" tabindex="-1"><small>Decisão ${n} de ${CONFIG.totalDecisions}: ${MOMENTS[scene.moment]}</small>Como você responde?</legend>
      <p class="prompt">${esc(scene.prompt)}</p>
      <div class="options">${scene.options.map(o=>`
        <label class="option"><input type="radio" name="opt" value="${o.id}" ${app.selected===o.id?"checked":""}>
          <span class="option-body"><span class="radio-dot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><span>${esc(o.text)}</span></span></label>`).join("")}
      </div>
      <div class="actions"><button type="submit" class="btn primary" id="btn-confirm" ${app.selected?"":"disabled"}>${icon("check")}Confirmar escolha</button>
        <span class="muted" style="font-size:.9rem">Selecione uma alternativa e confirme.</span></div>
    </fieldset></form>`;
}
function feedbackHTML(st){
  const t=st.trail[st.trail.length-1], fb=t.option.fb;
  const focus=COMP_KEYS.filter(c=>t.option.scores[c]>=2);
  const main=focus.length?focus:[COMP_KEYS.reduce((a,c)=>t.option.scores[c]>t.option.scores[a]?c:a,"emp")];
  let mood="";
  if(!st.finished){
    const before=EMOTIONS[t.variant.emotion], nv=pickVariant(SCENES[st.sceneId],st), after=EMOTIONS[nv.emotion];
    const dir=after.level>before.level?"up":after.level<before.level?"down":"same";
    const txt={up:"Rafael ficou mais aberto",down:"Rafael ficou mais resistente",same:"Rafael manteve o nível de abertura"}[dir];
    mood=`<div class="fb-block wide"><h4>Efeito na conversa</h4><div class="mood-shift">${icon(dir)}<span>${txt}: <b>${before.label}</b> para <b>${after.label}</b>.</span></div></div>`;
  }
  const last=st.finished;
  return `<div class="fb" aria-live="polite">
    <div class="fb-head"><h2 id="fb-title" tabindex="-1">Feedback da decisão ${t.n}</h2>
      <div class="row"><span class="muted" style="font-size:.9rem">Competência em foco:</span>${main.map(c=>`<span class="chip">${icon(COMPETENCIES[c].icon)}${COMPETENCIES[c].name}</span>`).join("")}</div></div>
    <div class="fb-grid">
      <div class="fb-block"><h4>O que sua resposta comunicou</h4><p>${esc(fb.comunica)}</p></div>
      <div class="fb-block"><h4>Comportamento profissional demonstrado</h4><p>${esc(fb.comportamento)}</p></div>
      <div class="fb-block"><h4>Consequência na conversa</h4><p>${esc(pickText(fb.consequencia,t.scene))}</p></div>
      <div class="fb-block"><h4>Recomendação</h4><p>${esc(fb.recomendacao)}</p></div>
      ${mood}
    </div>
    <div class="actions" style="margin-top:2px"><button class="btn primary" type="button" id="btn-continue" data-action="continue">${last?"Ver relatório final":"Continuar atendimento"}${icon("arrow")}</button></div>
  </div>`;
}
function renderSim(opts={}){
  const cur=app.store.current;
  if(!cur){ go("dashboard"); return; }
  let st; try{ st=computeState(cur.decisions); }catch(e){ app.store.current=null; saveStore(); toast("Não foi possível retomar a simulação salva. Ela foi reiniciada."); go("dashboard"); return; }
  const wantTyping=!!opts.typing && !cur.awaitingContinue && !st.finished && !reducedMotion();
  const bubbles=[]; st.trail.forEach(t=>{ bubbles.push({who:"client",text:t.variant.text,emotion:t.variant.emotion}); bubbles.push({who:"me",text:t.option.text}); });
  let currentClient=null;
  if(!cur.awaitingContinue && !st.finished){ currentClient=pickVariant(SCENES[st.sceneId],st); if(!wantTyping) bubbles.push({who:"client",text:currentClient.text,emotion:currentClient.emotion,isNew:!!opts.focus}); }
  const lastClient=[...bubbles].reverse().find(b=>b.who==="client");
  const emotion=lastClient?lastClient.emotion:(currentClient?currentClient.emotion:"irritado");
  const done=st.trail.length, pct=Math.round(done/CONFIG.totalDecisions*100);
  const wide=window.matchMedia("(min-width:1001px)").matches;
  let area;
  if(cur.awaitingContinue) area=feedbackHTML(st);
  else if(wantTyping) area=`<p class="muted" id="typing-note">Rafael está digitando uma resposta…</p>`;
  else area=choiceHTML(st);

  $("#screen-sim").innerHTML=`
  <h1 class="sr-only" tabindex="-1">Simulação de atendimento: Cliente em situação de conflito</h1>
  <div class="sim">
    <aside class="sim-side card" aria-label="Informações do cenário">
      <div class="client-card"><div class="avatar" aria-hidden="true">RM</div><div><b>Rafael Martins</b><br><span class="chip warn" style="margin-top:4px">Cliente insatisfeito</span></div></div>
      <div><div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:.95rem">Progresso</b><span class="muted" style="font-size:.9rem">${done} de ${CONFIG.totalDecisions} decisões</span></div>
        <div class="progress" role="progressbar" aria-label="Progresso da simulação" aria-valuemin="0" aria-valuemax="${CONFIG.totalDecisions}" aria-valuenow="${done}"><span style="width:${pct}%"></span></div></div>
      <details class="acc" ${wide?"open":""}><summary>Contexto do caso</summary><div class="acc-body"><p>Nexora, empresa de serviços digitais. Chamado 48213 aberto há nove dias por cobrança duplicada no plano Business. Rafael recebeu prazos diferentes e ameaça cancelar o contrato.</p></div></details>
      <details class="acc" ${wide?"open":""}><summary>Competências observadas</summary><div class="acc-body">${compList()}<p>Os resultados por competência aparecem no relatório final.</p></div></details>
      <div class="row"><button class="btn small danger" type="button" data-action="restart">${icon("refresh")}Reiniciar</button>
        <button class="btn small" type="button" data-action="go-dashboard">Sair e continuar depois</button></div>
    </aside>
    <div class="sim-main">
      <section class="card" aria-label="Conversa com o cliente">
        <div class="chat-head"><div class="who"><div class="avatar" aria-hidden="true">RM</div><div><b>Rafael Martins</b><br><span class="muted" style="font-size:.88rem">Atendimento Nexora, chamado 48213</span></div></div>${emotionMeter(emotion)}</div>
        <div class="chat-log" id="chat-log" tabindex="0" role="region" aria-label="Histórico da conversa">
          ${bubbles.map(bubbleHTML).join("")}
          ${wantTyping?`<div class="msg client"><div class="avatar sm" aria-hidden="true">RM</div><div class="bubble"><div class="who">Rafael Martins</div><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span></div></div>`:""}
        </div>
      </section>
      <section class="card decision" id="decision-area" aria-label="Decisão atual">${area}</section>
    </div>
  </div>`;
  const log=$("#chat-log"); log.scrollTop=log.scrollHeight;
  if(wantTyping){
    app.typingTimer=setTimeout(()=>{ renderSim({focus:"decision",announceClient:true}); },1000);
    return;
  }
  if(opts.announceClient && currentClient) announce("Rafael: "+currentClient.text);
  if(opts.focus==="feedback") focusEl($("#fb-title"));
  else if(opts.focus==="decision") { const l=$("#decision-legend"); if(l) l.focus({preventScroll:true}); window.scrollTo({top:$("#decision-area").offsetTop-120,behavior:reducedMotion()?"auto":"smooth"}); }
}
function startTyping(){ renderSim({typing:true}); }

/* Ações do simulador */
async function confirmChoice(){
  if(app.locked||!app.selected) return;
  const cur=app.store.current; let st; try{ st=computeState(cur.decisions); }catch(e){ return; }
  if(!SCENES[st.sceneId].options.some(o=>o.id===app.selected)) return;
  app.locked=true;
  cur.decisions.push({scene:st.sceneId,option:app.selected}); cur.awaitingContinue=true; saveStore();
  app.selected=null; renderSim({focus:"feedback"}); app.locked=false;
}
function continueSim(){
  if(app.locked) return; app.locked=true;
  const cur=app.store.current; const st=computeState(cur.decisions);
  cur.awaitingContinue=false;
  if(st.finished){ finishAttempt(); app.locked=false; return; }
  saveStore(); startTyping(); app.locked=false;
}
function finishAttempt(){
  const cur=app.store.current, r=computeResult(cur.decisions);
  const attempt={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:new Date().toISOString(),decisions:cur.decisions.slice(),summary:{overall:r.overall,outcome:r.outcome.key,pct:r.pct,trust:r.trust}};
  app.store.history.unshift(attempt); app.store.current=null; saveStore();
  app.reportId=attempt.id; app.reportFresh=true; go("report");
}
async function restartSim(){
  const ok=await confirmDialog({title:"Reiniciar a simulação?",text:"O progresso desta simulação será descartado e o atendimento recomeça do início.",confirmLabel:"Reiniciar",danger:true});
  if(!ok) return;
  app.store.current=newCurrent(); saveStore(); app.selected=null; startTyping(); announce("Simulação reiniciada.");
}

/* =====================================================================
   I. RENDERIZAÇÃO: RELATÓRIO

function pathMapSVG(trail){
  const xs=i=>56+i*96, ys=i=>34+i*44;
  const pts=trail.map((t,i)=>[xs(i),ys(t.index)]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const nodes=trail.map((t,i)=>{
    const d=t.trustAfter-t.trustBefore, fill=d>0?"#15966A":d<0?"#D96767":"#E4A64B", sym=d>0?"+":d<0?"−":"=", col=d===0?"#15253E":"#fff";
    return `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="14" fill="${fill}" stroke="#fff" stroke-width="3"/><text x="${pts[i][0]}" y="${pts[i][1]+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${col}">${sym}</text><text x="${pts[i][0]}" y="146" text-anchor="middle" font-size="12" fill="#4F5E75">D${t.n}</text>`;
  }).join("");
  const guides=[0,1,2].map(i=>`<line x1="24" x2="600" y1="${ys(i)}" y2="${ys(i)}" stroke="#E4EAF3" stroke-dasharray="3 5"/><text x="8" y="${ys(i)+4}" font-size="11" fill="#4F5E75">${"ABC"[i]}</text>`).join("");
  return `<svg class="pathmap" viewBox="0 0 620 156" role="img" aria-label="Mapa do caminho percorrido: ${trail.map(t=>"decisão "+t.n+" alternativa "+"ABC"[t.index]).join(", ")}">${guides}<polyline points="${line}" fill="none" stroke="#176B83" stroke-width="2.5" stroke-linejoin="round"/>${nodes}</svg>`;
}
function renderReport(){
  const host=$("#screen-report");
  const a=app.store.history.find(x=>x.id===app.reportId);
  let r=null; if(a){ try{ r=computeResult(a.decisions); }catch(e){ r=null; } }
  if(!a||!r){ host.innerHTML=`<div class="page-head"><h1 tabindex="-1">Relatório indisponível</h1><p>Não encontramos os dados desta tentativa.</p></div><button class="btn primary" type="button" data-action="go-history">Ir para o histórico</button>`; return; }
  const trail=r.st.trail, o=r.outcome;
  const ringColor=o.key==="positive"?"var(--green)":o.key==="critical"?"var(--red)":"var(--amber)";
  const strengths=trail.filter(t=>Math.max(...COMP_KEYS.map(c=>t.option.scores[c]))>=3||t.option.trust>=2).slice(0,4).map(t=>`Decisão ${t.n}: ${t.option.shows}.`);
  const gaps=trail.filter(t=>COMP_KEYS.reduce((s,c)=>s+t.option.scores[c],0)<=4||t.option.trust<0).slice(0,4).map(t=>`Decisão ${t.n}: ${t.option.risk}.`);
  const lowest=COMP_KEYS.reduce((x,c)=>r.pct[c]<r.pct[x]?c:x,"emp");
  if(!gaps.length) gaps.push(`A competência com menor indicador foi ${COMPETENCIES[lowest].name.toLowerCase()} (${r.pct[lowest]}%). Experimente caminhos alternativos para comparar consequências.`);
  if(!strengths.length) strengths.push("Nenhuma decisão se destacou de forma consistente nesta tentativa. Use as recomendações abaixo como ponto de partida.");
  const delta=t=>t.trustAfter-t.trustBefore;
  const trustTxt=t=>delta(t)>0?{c:"ok",i:"up",l:"Aumentou a confiança do cliente"}:delta(t)<0?{c:"risk",i:"down",l:"Reduziu a confiança do cliente"}:{c:"warn",i:"same",l:"Manteve a confiança do cliente"};
  host.innerHTML=`
  <div class="page-head"><h1 tabindex="-1">${app.reportFresh?"Simulação concluída":"Relatório da tentativa"}</h1>
    <p>${app.reportFresh?"Você concluiu o atendimento de Rafael Martins. Veja abaixo como as suas decisões moldaram a conversa.":"Tentativa realizada em "+esc(fmtDate(a.date))+"."}</p></div>
  <div class="stack">
    <section class="card" aria-labelledby="res-title">
      <div class="report-hero">
        <div class="score-ring" style="--p:${r.overall};--ring:${ringColor}" role="img" aria-label="Pontuação geral: ${r.overall} de 100"><div><span><b>${r.overall}</b><small>de 100</small></span></div></div>
        <div><span class="chip ${o.chip}">${o.chip==="ok"?icon("check"):icon("alert")}${esc(o.label)}</span>
          <h2 id="res-title" style="margin:12px 0 8px">Resultado geral da simulação</h2>
          <p style="max-width:68ch">${esc(o.narrative)}</p>
          <p class="quote">Rafael: “${esc(o.client)}”</p></div>
      </div>
      ${r.notes.length?`<h3 style="margin:22px 0 4px">O que no seu histórico de decisões pesou no desfecho</h3><ul class="list">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
      <div class="notice info" style="margin-top:20px">${icon("info")}<span>A pontuação é um indicador desta simulação e depende do cenário e das alternativas oferecidas. Ela não mede a competência profissional de forma definitiva nem é uma avaliação psicológica validada.</span></div>
    </section>

    <section class="card" aria-labelledby="comp-title">
      <h2 id="comp-title" style="margin-bottom:18px">Desempenho por competência</h2>
      <div class="comp-report">${COMP_KEYS.map(c=>{ const b=bandOf(r.pct[c]); return `<div class="comp-row">
        <div class="top"><b>${COMPETENCIES[c].name}</b><span><b>${r.pct[c]}%</b> <span class="chip ${b.cls}">${b.label}</span></span></div>
        <div class="bar ${b.cls}" role="img" aria-label="${COMPETENCIES[c].name}: ${r.pct[c]} por cento"><span style="width:${r.pct[c]}%"></span></div>
        <p class="muted" style="font-size:.93rem"><b>Decisões que influenciaram:</b> ${trail.map(t=>`D${t.n} (${t.option.scores[c]}/3)`).join(", ")}.</p>
        <p style="font-size:.95rem">${esc(COMPETENCIES[c].recs[b.key])}</p></div>`; }).join("")}</div>
    </section>

    <div class="cols-2">
      <section class="card" aria-labelledby="str-title"><h2 id="str-title">Pontos fortes demonstrados</h2><ul class="list">${strengths.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="card" aria-labelledby="gap-title"><h2 id="gap-title">Oportunidades de desenvolvimento</h2><ul class="list">${gaps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>
    </div>

    <section class="card" aria-labelledby="path-title">
      <h2 id="path-title">Caminho percorrido</h2>
      <p class="muted" style="margin:8px 0 14px;max-width:70ch">Cada ponto mostra qual das três alternativas (A, B ou C, de cima para baixo) você escolheu em cada decisão, e o símbolo indica o efeito sobre a confiança do cliente: + aumentou, = manteve, − reduziu.</p>
      ${pathMapSVG(trail)}
    </section>

    <section class="card" aria-labelledby="chrono-title">
      <h2 id="chrono-title" style="margin-bottom:6px">Resumo cronológico das decisões</h2>
      ${trail.map(t=>{ const tt=trustTxt(t); return `<article class="step" aria-label="Decisão ${t.n}">
        <div class="step-head"><h3>Decisão ${t.n}: ${MOMENTS[t.scene.moment]}</h3><span class="chip ${tt.c}">${icon(tt.i)}${tt.l}</span></div>
        <p class="muted" style="font-size:.92rem">Rafael disse: “${esc(t.variant.text)}”</p>
        <div class="said"><b>${esc(t.option.label)}.</b> ${esc(t.option.text)}</div>
        <div class="effects">${COMP_KEYS.map(c=>`<span class="chip plain">${COMPETENCIES[c].name}: ${t.option.scores[c]}/3</span>`).join("")}</div>
        <p><b>Como influenciou o resultado:</b> ${esc(pickText(t.option.fb.consequencia,t.scene))}</p>
      </article>`; }).join("")}
    </section>

    <details class="acc"><summary>Como a pontuação é calculada</summary><div class="acc-body">
      <p>Cada alternativa recebe de 0 a 3 pontos em cada competência: 0 = não demonstrada, 1 = demonstrada parcialmente, 2 = demonstrada de forma consistente, 3 = demonstrada de forma intensa e adequada ao contexto. Cada alternativa também altera a confiança do cliente, o que influencia o desfecho.</p>
      <p>Os pontos de cada competência são somados nas seis decisões e normalizados de 0 a 100 em relação ao máximo possível naquela competência no cenário. Atingir 100% nas três ao mesmo tempo não é possível, porque as alternativas envolvem trocas entre empatia, comunicação e resolução. A pontuação geral é a média das três.</p>
      <p>O desfecho depende do histórico completo: confiança acumulada, pontuação geral e decisões-chave, como informar de forma vaga ou transferir o caso, e não apenas da última resposta.</p>
    </div></details>

    <div class="report-actions">
      <button class="btn primary" type="button" data-action="retry">${icon("refresh")}Tentar novamente</button>
      <button class="btn" type="button" data-action="go-dashboard">${icon("home")}Voltar ao dashboard</button>
      <button class="btn" type="button" data-action="print">${icon("print")}Imprimir relatório</button>
    </div>
  </div>`;
}

/* =====================================================================
   K. EVENTOS E INICIALIZAÇÃO
   ===================================================================== */
document.addEventListener("click",async e=>{
  const btn=e.target.closest("[data-action]"); if(!btn) return;
  const act=btn.dataset.action;
  switch(act){
    case "go-dashboard": go("dashboard"); break;
    case "go-history": go("history"); break;
    case "start": go("briefing"); break;
    case "begin":{
      if(app.store.current && app.store.current.decisions.length){
        const ok=await confirmDialog({title:"Substituir a simulação em andamento?",text:"Existe uma simulação não concluída. Começar um novo atendimento descarta esse progresso.",confirmLabel:"Começar do zero",danger:true});
        if(!ok) break;
      }
      app.store.current=newCurrent(); saveStore(); go("sim",{focus:false,sim:{typing:true}}); window.scrollTo(0,0); announce("Atendimento iniciado.");
      break;}
    case "resume": go("sim",{sim:{focus:"decision",announceClient:false}}); break;
    case "continue": continueSim(); break;
    case "restart": restartSim(); break;
    case "view-report": app.reportId=btn.dataset.id; app.reportFresh=false; go("report"); break;
    case "retry": go("briefing"); break;
    case "print": window.print(); break;
    case "delete-one":{
      const ok=await confirmDialog({title:"Excluir esta tentativa?",text:"O registro será removido deste navegador e não poderá ser recuperado.",confirmLabel:"Excluir",danger:true});
      if(ok){ app.store.history=app.store.history.filter(a=>a.id!==btn.dataset.id); saveStore(); renderHistory(); toast("Tentativa excluída."); announce("Tentativa excluída."); focusEl($("#screen-history h1")); }
      break;}
    case "delete-all":{
      const ok=await confirmDialog({title:"Excluir todo o histórico?",text:"Todas as tentativas concluídas serão removidas deste navegador. Uma simulação em andamento não é afetada.",confirmLabel:"Excluir tudo",danger:true});
      if(ok){ app.store.history=[]; saveStore(); renderHistory(); toast("Histórico excluído."); announce("Histórico excluído."); focusEl($("#screen-history h1")); }
      break;}
  }
});
document.addEventListener("change",e=>{
  if(e.target.name==="opt"){ app.selected=e.target.value; const b=$("#btn-confirm"); if(b) b.disabled=false; }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="choice-form"){ e.preventDefault(); confirmChoice(); }
});

function init(){
  const errs=validateScenario();
  if(errs.length){ console.error("DecisionLab: problemas no cenário:",errs); toast("Foi detectado um problema na configuração do cenário. Consulte o console do navegador."); }
  app.store=loadStore();
  go("dashboard",{focus:false});
  if(app.notice) announce(app.notice);
}
init();
</script>
